name: Sync EduPage tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: edupage-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public alpha
        uses: actions/checkout@v4

      - name: Fetch and parse EduPage Webcal
        env:
          EDUPAGE_WEBCAL_URL: ${{ secrets.EDUPAGE_WEBCAL_URL }}
        run: |
          if [ -z "$EDUPAGE_WEBCAL_URL" ]; then
            echo "EduPage Webcal secret is not configured yet; skipping."
            exit 0
          fi
          python scripts/sync_edupage.py

      - name: Publish changes when the calendar changed
        run: |
          if git diff --quiet -- edupage-tests.json; then
            echo "No calendar changes."
            exit 0
          fi
          git config user.name "studyroom-bot"
          git config user.email "studyroom-bot@users.noreply.github.com"
          git add edupage-tests.json
          git commit -m "Sync EduPage tests"
          git push
